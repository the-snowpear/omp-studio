name: Cache Runtime dependencies
description: Share Bun packages on main; compiled addons are separate source-addressed artifacts
inputs:
  cargo:
    description: Preserve the Cargo host cache for manual source/package checks
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      if: github.ref == 'refs/heads/main'
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('omp-patch/vendor/oh-my-pi/bun.lock') }}
        restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
    - uses: Swatinem/rust-cache@v2
      if: inputs.cargo == 'true'
      with:
        workspaces: omp-patch/vendor/oh-my-pi -> target
        prefix-key: v1-host-check-rust
        shared-key: natives
        env-vars: OMP_NATIVE_CARGO_PROFILE OMP_NATIVE_FEATURES
        cache-workspace-crates: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/cache/restore@v4
      if: github.ref != 'refs/heads/main'
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('omp-patch/vendor/oh-my-pi/bun.lock') }}
        restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
