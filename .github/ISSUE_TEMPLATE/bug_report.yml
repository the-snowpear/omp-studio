name: Bug Report
description: Crash, wrong behaviour, or a broken surface
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security** issue, do not use this form — follow [SECURITY.md](https://github.com/the-snowpear/omp-studio/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: One or two sentences. What did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include whether Preview mode was on.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Workbench / conversation
        - Composer / approvals / Plan
        - Agent Hub / Skills / MCP / models
        - Git / file tree / workspace
        - Terminal / settings / diagnostics
        - Host / Runtime / installer
        - Docs / CI
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag (e.g. v0.1.0) or `git rev-parse --short HEAD`
      placeholder: v0.1.0 or abcdef1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Host log is `%APPDATA%\omp-studio\logs\host-YYYY-MM-DD.log`. Redact tokens and absolute paths you do not want public.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Screenshots, `models.yml` with secrets stripped, related PRs.
