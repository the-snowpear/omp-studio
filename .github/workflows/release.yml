name: Release

on:
  workflow_dispatch:
    inputs:
      build_runtime:
        description: "Rebuild OMP Runtime from source"
        type: boolean
        default: false
      reuse_runtime_tag:
        description: "Tag to reuse runtime assets from (e.g. v0.1.3)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: omp-studio-release
  cancel-in-progress: false

jobs:
  runtime:
    if: inputs.build_runtime
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run omp:install-deps

      - name: Build and sign Runtime
        env:
          OMP_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:OMP_RUNTIME_SIGNING_KEY_ID = (Get-Content packaging/keys/trusted-keys.json | ConvertFrom-Json).activeKeyId
          $tempKey = Join-Path $env:RUNNER_TEMP "omp-signing.pem"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($tempKey, $env:OMP_SIGNING_SECRET, $utf8NoBom)
          $env:OMP_RUNTIME_SIGNING_KEY = $tempKey
          npm run omp:build:host
          Remove-Item -Force $tempKey

      - name: Cleanup signing key on failure
        if: always()
        run: |
          $tempKey = Join-Path $env:RUNNER_TEMP "omp-signing.pem"
          if (Test-Path $tempKey) { Remove-Item -Force $tempKey }

      - name: Upload Runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact
          path: packages/runtime-installer/dist/artifacts/win32-x64/
          if-no-files-found: error

  app:
    needs: [runtime]
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate release version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match package version" }
          "OMP_RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run omp:install-deps

      - name: Verify gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check
          npm run omp:test:metadata
          npm run omp:verify:patches

      - name: Retrieve Runtime artifacts
        if: ${{ !inputs.build_runtime }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $destDir = "packages/runtime-installer/dist/artifacts/win32-x64"
          New-Item -ItemType Directory -Force -Path $destDir
          if ($env:REUSE_RUNTIME_TAG) {
            gh release download $env:REUSE_RUNTIME_TAG --pattern "omp.exe" --pattern "runtime-manifest.json" --pattern "checksums.json" --pattern "runtime-signature.json" --dir $destDir
          } else {
            Write-Host "Downloading runtime from latest release..."
            gh release download --pattern "omp.exe" --pattern "runtime-manifest.json" --pattern "checksums.json" --pattern "runtime-signature.json" --dir $destDir
          }
        env:
          REUSE_RUNTIME_TAG: ${{ inputs.reuse_runtime_tag }}

      - name: Download built runtime artifact
        if: inputs.build_runtime
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact
          path: packages/runtime-installer/dist/artifacts/win32-x64/

      - name: Build Windows installer
        run: npm run pack:win -- --skip-host

      - name: Retrieve previous update sequence
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $releases = @(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json)
          if ($releases.Count -gt 0) {
            $previous = gh release view $releases[0].tagName --json assets | ConvertFrom-Json
            if ($previous.assets.name -contains "update-index.json") {
              $dest = Join-Path $env:RUNNER_TEMP "previous-update"
              gh release download $releases[0].tagName --pattern "update-index.json" --dir $dest
              "OMP_PREVIOUS_UPDATE_INDEX=$(Join-Path $dest 'update-index.json')" >> $env:GITHUB_ENV
            }
          }

      - name: Build update assets
        env:
          OMP_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:OMP_RUNTIME_SIGNING_KEY_ID = (Get-Content packaging/keys/trusted-keys.json | ConvertFrom-Json).activeKeyId
          $tempKey = Join-Path $env:RUNNER_TEMP "omp-signing.pem"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($tempKey, $env:OMP_SIGNING_SECRET, $utf8NoBom)
          $env:OMP_RUNTIME_SIGNING_KEY = $tempKey
          node scripts/build-update-assets.mjs
          Remove-Item -Force $tempKey

      - name: Cleanup signing key on failure
        if: always()
        run: |
          $tempKey = Join-Path $env:RUNNER_TEMP "omp-signing.pem"
          if (Test-Path $tempKey) { Remove-Item -Force $tempKey }

      - name: Run P5 readiness gate after assets exist
        run: npm run p5:gate

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:OMP_RELEASE_TAG
          $existing = @(gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json) | Where-Object tagName -eq $tag
          if ($existing -and !$existing.isDraft) { throw "Refusing to overwrite a published release" }
          if (!$existing) { gh release create $tag --target $env:GITHUB_SHA --draft --title $tag --generate-notes }
          $files = @(
            (Get-Item outputs/installer/OMP-Studio-Setup-*.exe).FullName,
            (Get-Item outputs/release/omp-studio-app-*.tar.gz).FullName,
            (Get-Item outputs/release/update-index.json).FullName,
            (Get-Item outputs/release/update-index.sig.json).FullName
          )
          # Runtime URLs name this release even when its Runtime bytes are reused.
          $runtime = @(Get-ChildItem packaging/runtime-payload -Directory)
          if ($runtime.Count -ne 1) { throw "Expected exactly one staged Runtime" }
          foreach ($name in @("omp.exe", "runtime-manifest.json", "checksums.json", "runtime-signature.json")) {
            $files += (Get-Item (Join-Path $runtime[0].FullName $name)).FullName
          }
          gh release upload $tag @files --clobber
          gh release edit $tag --draft=false --latest
