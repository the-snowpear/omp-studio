name: Release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Desktop release or independently versioned Runtime
        type: choice
        options: [desktop, runtime]
        default: desktop
      target_arch:
        description: Build only on matching native Windows runners
        type: choice
        options: [both, x64, arm64]
        default: both
      runtime_channel:
        type: choice
        description: Desktop releases must bundle stable Runtime
        options: [stable, canary]
        default: stable
      runtime_min_app_version:
        type: string
        description: Tested minimum desktop version (blank uses workspace version)
        default: ""
      reuse_runtime_run_id:
        type: string
        description: Optional previous workflow run with matching signed Runtime artifacts
        default: ""
  push:
    tags: ["v*", "runtime-v*"]

permissions:
  contents: read
concurrency:
  group: omp-studio-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      kind: ${{ steps.config.outputs.kind }}
    steps:
      - id: config
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'both' }}
          REQUEST_KIND: ${{ inputs.release_kind || (startsWith(github.ref_name, 'runtime-v') && 'runtime') || 'desktop' }}
        run: |
          if [ "$TARGET_ARCH" = both ]; then
            echo 'matrix={"include":[{"arch":"x64","os":"windows-latest"},{"arch":"arm64","os":"windows-11-arm"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$TARGET_ARCH" = arm64 ]; then
            echo 'matrix={"include":[{"arch":"arm64","os":"windows-11-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"x64","os":"windows-latest"}]}' >> "$GITHUB_OUTPUT"
          fi
          echo "kind=$REQUEST_KIND" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_TARGET_ARCH: ${{ matrix.arch }}
      OMP_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
      OMP_RUNTIME_CHANNEL: ${{ inputs.runtime_channel || 'stable' }}
      OMP_RUNTIME_MIN_APP_VERSION: ${{ inputs.runtime_min_app_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          key: ${{ matrix.arch }}
      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run omp:install-deps
      - name: Reuse signed Runtime
        if: inputs.reuse_runtime_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-${{ matrix.arch }}
          path: packages/runtime-installer/dist/artifacts/win32-${{ matrix.arch }}/
          run-id: ${{ inputs.reuse_runtime_run_id }}
          github-token: ${{ github.token }}
      - name: Build Runtime, verify, package and sign release
        env:
          OMP_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
          REUSE_RUNTIME_RUN_ID: ${{ inputs.reuse_runtime_run_id }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $keyPath = Join-Path $env:RUNNER_TEMP "omp-release-signing.pem"
          try {
            [IO.File]::WriteAllText($keyPath, $env:OMP_SIGNING_SECRET, [Text.UTF8Encoding]::new($false))
            $env:OMP_RUNTIME_SIGNING_KEY = $keyPath
            $env:OMP_RUNTIME_SIGNING_KEY_ID = (Get-Content packaging/keys/trusted-keys.json | ConvertFrom-Json).activeKeyId
            if (!$env:REUSE_RUNTIME_RUN_ID) {
              npm run omp:overlay:apply
              npm run omp:build:host
            } else {
              npm run build
              node scripts/prepare-runtime-test-native.mjs
            }
            npm run check
            npm run omp:test:metadata
            if (!$env:REUSE_RUNTIME_RUN_ID) { node scripts/unapply-release-overlay.mjs }
            npm run omp:verify:patches -- --skip-workspace-check
            npm run pack:win:prepare
            $runtime = Get-ChildItem packaging/runtime-payload -Recurse -Filter runtime-manifest.json | ForEach-Object { Get-Content $_.FullName | ConvertFrom-Json }
            if (@($runtime).Count -ne 1 -or $runtime.channel -ne $env:OMP_RUNTIME_CHANNEL) { throw "Runtime identity/channel mismatch" }
            $appVersion = (Get-Content package.json | ConvertFrom-Json).version
            $tag = if ($env:OMP_RELEASE_KIND -eq "runtime") { "runtime-v$($runtime.runtimeVersion)" } else { "v$appVersion" }
            if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Release tag mismatch" }
            if ($env:OMP_RELEASE_KIND -eq "desktop" -and ($runtime.channel -ne "stable" -or $appVersion -match '-')) { throw "Desktop releases must be stable" }
            $env:OMP_RELEASE_TAG = $tag
            node scripts/collect-update-history.mjs
            Get-Content $env:GITHUB_ENV | Where-Object { $_ -match '^OMP_PREVIOUS_(CATALOG_DIR|UPDATE_INDEX)=' } | ForEach-Object {
              $pair = $_ -split '=', 2
              [Environment]::SetEnvironmentVariable($pair[0], $pair[1], 'Process')
            }
            if ($env:OMP_RELEASE_KIND -eq "desktop") { npm run pack:win -- --skip-host --skip-build }
            npm run updates:build
            npm run updates:verify
            npm run p5:gate
          } finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact-${{ matrix.arch }}
          path: packages/runtime-installer/dist/artifacts/win32-${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.arch }}
          path: outputs/release/${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-*
          path: outputs/publish
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
        run: node scripts/publish-update-release.mjs
