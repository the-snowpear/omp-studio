name: Release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Desktop release or independently versioned Runtime
        type: choice
        options: [desktop, runtime]
        default: desktop
      target_arch:
        description: Build only on matching native Windows runners
        type: choice
        options: [both, x64, arm64]
        default: both
      runtime_channel:
        type: choice
        description: Desktop releases must bundle stable Runtime
        options: [stable, canary]
        default: stable
      runtime_min_app_version:
        type: string
        description: Tested minimum desktop version (blank uses workspace version)
        default: ""
      rebuild_runtime:
        type: boolean
        description: Force a Runtime rebuild even when its sources are unchanged
        default: false
      include_macos:
        type: boolean
        description: Also build and publish macOS (darwin-arm64, ad hoc signed)
        default: false
  push:
    tags: ["v*", "runtime-v*"]

permissions:
  contents: read
env:
  BUN_VERSION: "1.4.4"
concurrency:
  group: omp-studio-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      kind: ${{ steps.config.outputs.kind }}
    steps:
      - id: config
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'both' }}
          REQUEST_KIND: ${{ inputs.release_kind || (startsWith(github.ref_name, 'runtime-v') && 'runtime') || 'desktop' }}
        run: |
          if [ "$TARGET_ARCH" = both ]; then
            echo 'matrix={"include":[{"arch":"x64","os":"windows-latest"},{"arch":"arm64","os":"windows-11-arm"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$TARGET_ARCH" = arm64 ]; then
            echo 'matrix={"include":[{"arch":"arm64","os":"windows-11-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"x64","os":"windows-latest"}]}' >> "$GITHUB_OUTPUT"
          fi
          echo "kind=$REQUEST_KIND" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_TARGET_ARCH: ${{ matrix.arch }}
      OMP_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
      OMP_RUNTIME_CHANNEL: ${{ inputs.runtime_channel || 'stable' }}
      OMP_RUNTIME_MIN_APP_VERSION: ${{ inputs.runtime_min_app_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Find reusable Runtime
        id: runtime
        shell: bash
        env:
          PLATFORM: win32-${{ matrix.arch }}
          REBUILD: ${{ inputs.rebuild_runtime }}
        run: bash .github/scripts/find-runtime.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/cache-release-downloads
        with:
          desktop: "true"
      - uses: oven-sh/setup-bun@v2
        if: steps.runtime.outputs.run_id == ''
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: Swatinem/rust-cache@v2
        if: steps.runtime.outputs.run_id == ''
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          shared-key: platform
          key: natives-win32-${{ matrix.arch }}
          cache-on-failure: "true"
      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefer-offline --no-audit --no-fund
      - uses: ./.github/actions/cache-desktop-native
      - name: Reuse signed Runtime
        if: steps.runtime.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.runtime.outputs.name }}
          path: packages/runtime-installer/dist/artifacts/win32-${{ matrix.arch }}/
          run-id: ${{ steps.runtime.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build, package and verify release
        env:
          OMP_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
          REUSE_RUNTIME_RUN_ID: ${{ steps.runtime.outputs.run_id }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $keyPath = Join-Path $env:RUNNER_TEMP "omp-release-signing.pem"
          try {
            [IO.File]::WriteAllText($keyPath, $env:OMP_SIGNING_SECRET, [Text.UTF8Encoding]::new($false))
            $env:OMP_RUNTIME_SIGNING_KEY = $keyPath
            $env:OMP_RUNTIME_SIGNING_KEY_ID = (Get-Content packaging/keys/trusted-keys.json | ConvertFrom-Json).activeKeyId
            npm run omp:overlay:apply
            if (!$env:REUSE_RUNTIME_RUN_ID) {
              npm run omp:build:host
            } else {
              npm run build
            }
            npm run pack:win:prepare
            $runtime = Get-ChildItem packaging/runtime-payload -Recurse -Filter runtime-manifest.json | ForEach-Object { Get-Content $_.FullName | ConvertFrom-Json }
            if (@($runtime).Count -ne 1 -or $runtime.channel -ne $env:OMP_RUNTIME_CHANNEL) { throw "Runtime identity/channel mismatch" }
            $appVersion = (Get-Content package.json | ConvertFrom-Json).version
            $tag = if ($env:OMP_RELEASE_KIND -eq "runtime") { "runtime-v$($runtime.runtimeVersion)" } else { "v$appVersion" }
            if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Release tag mismatch" }
            if ($env:OMP_RELEASE_KIND -eq "desktop" -and ($runtime.channel -ne "stable" -or $appVersion -match '-')) { throw "Desktop releases must be stable" }
            $env:OMP_RELEASE_TAG = $tag
            node scripts/collect-update-history.mjs
            Get-Content $env:GITHUB_ENV | Where-Object { $_ -match '^OMP_PREVIOUS_(CATALOG_DIR|UPDATE_INDEX)=' } | ForEach-Object {
              $pair = $_ -split '=', 2
              [Environment]::SetEnvironmentVariable($pair[0], $pair[1], 'Process')
            }
            if ($env:OMP_RELEASE_KIND -eq "desktop") { npm run pack:win -- --skip-host --skip-build }
            npm run updates:build
            npm run updates:verify
          } finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }
      - uses: actions/upload-artifact@v4
        if: steps.runtime.outputs.run_id == ''
        with:
          name: ${{ steps.runtime.outputs.key }}
          compression-level: 0
          path: packages/runtime-installer/dist/artifacts/win32-${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.arch }}
          compression-level: 0
          path: outputs/release/${{ matrix.arch }}/
          if-no-files-found: error

  # macOS joins a release only when asked: publication is all-or-nothing, and
  # an ad hoc signed Mac build must not hold back the Windows release while it
  # stabilizes. Tag pushes never enable it.
  build-macos:
    needs: prepare
    if: ${{ inputs.include_macos }}
    runs-on: macos-15
    environment: release
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_TARGET_PLATFORM: darwin
      OMP_TARGET_ARCH: arm64
      OMP_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
      OMP_RUNTIME_CHANNEL: ${{ inputs.runtime_channel || 'stable' }}
      OMP_RUNTIME_MIN_APP_VERSION: ${{ inputs.runtime_min_app_version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Find reusable Runtime
        id: runtime
        env:
          PLATFORM: darwin-arm64
          REBUILD: ${{ inputs.rebuild_runtime }}
        run: bash .github/scripts/find-runtime.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/cache-release-downloads
        with:
          desktop: "true"
      - uses: oven-sh/setup-bun@v2
        if: steps.runtime.outputs.run_id == ''
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: Swatinem/rust-cache@v2
        if: steps.runtime.outputs.run_id == ''
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          shared-key: platform
          key: natives-darwin-arm64
          cache-on-failure: "true"
      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
      - uses: ./.github/actions/cache-desktop-native
      - name: Reuse signed Runtime
        if: steps.runtime.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.runtime.outputs.name }}
          path: packages/runtime-installer/dist/artifacts/darwin-arm64/
          run-id: ${{ steps.runtime.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build, package and verify release
        env:
          OMP_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
          REUSE_RUNTIME_RUN_ID: ${{ steps.runtime.outputs.run_id }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/omp-release-signing.pem"
          trap 'rm -f "$key_path"' EXIT
          (umask 077 && printf '%s' "$OMP_SIGNING_SECRET" > "$key_path")
          export OMP_RUNTIME_SIGNING_KEY="$key_path"
          OMP_RUNTIME_SIGNING_KEY_ID="$(node -p 'require("./packaging/keys/trusted-keys.json").activeKeyId')"
          export OMP_RUNTIME_SIGNING_KEY_ID
          npm run omp:overlay:apply
          if [ -z "$REUSE_RUNTIME_RUN_ID" ]; then
            npm run omp:build:host
          else
            npm run build
          fi
          npm run pack:mac:prepare
          runtime_version="$(node -e '
            const fs = require("node:fs"), path = require("node:path");
            const root = "packaging/runtime-payload";
            const staged = fs.readdirSync(root).filter((name) => !name.startsWith("."));
            const manifest = staged.length === 1 ? JSON.parse(fs.readFileSync(path.join(root, staged[0], "runtime-manifest.json"), "utf8")) : undefined;
            if (!manifest || manifest.channel !== process.env.OMP_RUNTIME_CHANNEL) throw new Error("Runtime identity/channel mismatch");
            console.log(manifest.runtimeVersion);
          ')"
          app_version="$(node -p 'require("./package.json").version')"
          if [ "$OMP_RELEASE_KIND" = runtime ]; then tag="runtime-v$runtime_version"; else tag="v$app_version"; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then echo "Release tag mismatch" >&2; exit 1; fi
          if [ "$OMP_RELEASE_KIND" = desktop ] && { [ "$OMP_RUNTIME_CHANNEL" != stable ] || [[ "$app_version" == *-* ]]; }; then echo "Desktop releases must be stable" >&2; exit 1; fi
          export OMP_RELEASE_TAG="$tag"
          node scripts/collect-update-history.mjs
          while IFS='=' read -r name value; do
            case "$name" in OMP_PREVIOUS_CATALOG_DIR|OMP_PREVIOUS_UPDATE_INDEX) export "$name=$value" ;; esac
          done < "$GITHUB_ENV"
          if [ "$OMP_RELEASE_KIND" = desktop ]; then npm run pack:mac -- --skip-host --skip-build; fi
          npm run updates:build
          npm run updates:verify
      - uses: actions/upload-artifact@v4
        if: steps.runtime.outputs.run_id == ''
        with:
          name: ${{ steps.runtime.outputs.key }}
          compression-level: 0
          path: packages/runtime-installer/dist/artifacts/darwin-arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-darwin-arm64
          compression-level: 0
          path: outputs/release/darwin-arm64/
          if-no-files-found: error

  build-remote:
    needs: prepare
    if: needs.prepare.outputs.kind == 'desktop'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/remote-environments.yml
    with:
      rebuild_runtime: ${{ inputs.rebuild_runtime || false }}
    secrets: inherit

  publish:
    needs: [prepare, build, build-macos, build-remote]
    # A skipped macOS job (the default) must not skip the Windows release.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') && (needs.build-remote.result == 'success' || needs.build-remote.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-*
          path: outputs/publish
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
        run: node scripts/publish-update-release.mjs
