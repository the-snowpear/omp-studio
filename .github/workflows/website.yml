name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - apps/renderer/website-embed.html
      - apps/renderer/src/website-embed-entry.tsx
      - apps/renderer/src/embed/**
      - .github/workflows/website.yml
  workflow_dispatch:

concurrency:
  group: website-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies for live embed
        run: npm ci

      - name: Build workspace packages for live embed
        run: npm run build:packages

      - name: Install website dependencies
        run: npm --prefix website install --no-audit --no-fund --no-save

      - name: Typecheck website
        run: npm --prefix website run typecheck

      - name: Build live embed and website bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm --prefix website run live
          npm --prefix website run build

      - name: Publish dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd website/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: publish website from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
