name: Remote environments

on:
  workflow_call:
    inputs:
      rebuild_runtime:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild_runtime:
        type: boolean
        description: Force a Runtime rebuild even when its sources are unchanged
        default: false

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.4.2"
  OMP_RUNTIME_CHANNEL: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, os: windows-latest }
          - { target: win32-arm64, os: windows-11-arm }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_TARGET_PLATFORM: ${{ startsWith(matrix.target, 'win32-') && 'win32' || startsWith(matrix.target, 'darwin-') && 'darwin' || 'linux' }}
      OMP_TARGET_ARCH: ${{ endsWith(matrix.target, '-arm64') && 'arm64' || 'x64' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Find reusable Runtime
        id: runtime
        env:
          PLATFORM: ${{ matrix.target }}
          REBUILD: ${{ inputs.rebuild_runtime }}
        run: bash .github/scripts/find-runtime.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/cache-release-downloads
      - uses: oven-sh/setup-bun@v2
        if: steps.runtime.outputs.run_id == ''
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: Swatinem/rust-cache@v2
        if: steps.runtime.outputs.run_id == ''
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          shared-key: platform
          key: natives-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Install Host dependencies
        env:
          # Remote hosts use the bundled private Node, never Electron.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - run: npm run omp:overlay:apply
      - name: Reuse signed Runtime
        if: steps.runtime.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.runtime.outputs.name }}
          path: packages/runtime-installer/dist/artifacts/${{ matrix.target }}/
          run-id: ${{ steps.runtime.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build remote Host without desktop renderer
        run: npm run build:remote
      - name: Build signed native Runtime and complete remote environment
        env:
          OMP_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync(require("node:path").join(process.env.RUNNER_TEMP,"omp-remote-signing.pem"),process.env.OMP_SIGNING_SECRET,{mode:384})'
          export OMP_RUNTIME_SIGNING_KEY="$RUNNER_TEMP/omp-remote-signing.pem"
          trap 'rm -f "$OMP_RUNTIME_SIGNING_KEY"' EXIT
          export OMP_RUNTIME_SIGNING_KEY_ID="$(node -p 'require("./packaging/keys/trusted-keys.json").activeKeyId')"
          if [ -z "${{ steps.runtime.outputs.run_id }}" ]; then
            npm run omp:build:host -- --skip-build
          fi
          node scripts/build-remote-environment.mjs
          node scripts/verify-remote-environment.mjs "outputs/remote-environments/$TARGET"
      - uses: actions/upload-artifact@v4
        if: steps.runtime.outputs.run_id == ''
        with:
          name: ${{ steps.runtime.outputs.key }}-remote
          path: packages/runtime-installer/dist/artifacts/${{ matrix.target }}/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-remote-${{ matrix.target }}
          compression-level: 0
          path: outputs/remote-environments/${{ matrix.target }}/
          if-no-files-found: error
