name: Runtime compatibility

on:
  push:
  pull_request:

jobs:
  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run omp:install-deps
      - run: npm run check
      - run: npm run omp:test:metadata
      - run: npm run omp:verify:patches
