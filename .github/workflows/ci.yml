name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run omp:install-deps
      - run: npm run check
      - run: npm run omp:test:metadata
      # Runtime source tests load the pi-natives addon, which only a native
      # build produces; build just that addon (cargo, cached) for this host.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          key: natives-win32-x64
      - run: npm run omp:build:natives
      - run: npm run omp:verify:patches

  macos:
    name: macOS (arm64)
    # Pinned on purpose: macos-14 retires 2026-11-02 and macos-latest already
    # means macOS 26 with a different toolchain.
    runs-on: macos-15
    timeout-minutes: 60
    # Non-blocking until the macOS socket-path and platform fixes land; then
    # this becomes a required gate like the Windows job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run omp:install-deps
      - run: npm run check
      - run: npm run omp:test:metadata
      # Runtime source tests load the pi-natives addon, which only a native
      # build produces; build just that addon (cargo, cached) for this host.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          key: natives-darwin-arm64
      - run: npm run omp:build:natives
      - run: npm run omp:verify:patches

  macos-runtime:
    name: macOS Runtime build + pack (arm64)
    # Manual only: a full native + Bun build proves the darwin-arm64 artifact
    # path end to end, then pack:mac builds and audits the ad hoc signed app.
    # The throwaway key never leaves the runner and nothing is published; the
    # dmg and update zip are kept for a week for on-device testing only.
    # Release signing stays in release.yml.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          key: darwin-arm64
      - run: npm ci
      - run: npm run omp:install-deps
      - run: npm run omp:overlay:apply
      - run: npm run omp:keys
      - run: npm run omp:build:host
      # The Runtime above is signed with the throwaway key, so the app must
      # trust that key rather than the release keys in packaging/keys.
      - name: Pack and audit the ad hoc signed app
        run: |
          keys="$HOME/Library/Application Support/omp-studio/keys"
          export OMP_RUNTIME_TRUSTED_PUBLIC_KEY="$keys/trusted-public.pem"
          export OMP_RUNTIME_SIGNING_KEY_ID="$(tr -d '[:space:]' < "$keys/key-id.txt")"
          npm run pack:mac -- --skip-host
      - uses: actions/upload-artifact@v4
        with:
          name: omp-studio-macos-arm64-adhoc
          path: |
            outputs/installer-mac/*.dmg
            outputs/installer-mac/*.zip
          retention-days: 7
          if-no-files-found: error
