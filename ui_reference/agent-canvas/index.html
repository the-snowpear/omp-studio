<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 画布 · 交互原型</title>
<style>
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  --bg:#fbfbfc;--surface:#fff;--surface-2:#f2f2f5;--surface-3:#e8e8ec;--hover:rgba(20,20,30,.045);--active:rgba(20,20,30,.08);
  --border:rgba(15,18,25,.09);--border-strong:rgba(15,18,25,.16);--border-float:#9b958c;
  --text:#1d2129;--text-2:#4e5560;--text-3:#5c636e;--text-faint:#6d7480;--on-accent:#fff;
  --accent:#6e56cf;--accent-soft:rgba(110,86,207,.1);--accent-softer:rgba(110,86,207,.06);--accent-border:rgba(110,86,207,.35);
  --green:#137a52;--green-soft:rgba(19,122,82,.12);--amber:#8f5a05;--amber-soft:rgba(143,90,5,.12);--red:#c0272c;--red-soft:rgba(192,39,44,.1);
  --grid:rgba(15,18,25,.08);
}
:root[data-theme=dark]{
  --bg:#121519;--surface:#1a1b1f;--surface-2:#222329;--surface-3:#2b2c33;--hover:rgba(235,235,245,.05);--active:rgba(235,235,245,.09);
  --border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.12);--border-float:#46505f;
  --text:#e7e8eb;--text-2:#a7abb4;--text-3:#8b909a;--text-faint:#7c828c;--on-accent:#121316;
  --accent:#9e8cfc;--accent-soft:rgba(158,140,252,.14);--accent-softer:rgba(158,140,252,.08);--accent-border:rgba(158,140,252,.4);
  --green:#46b983;--green-soft:rgba(70,185,131,.15);--amber:#e0a23c;--amber-soft:rgba(224,162,60,.15);--red:#f06568;--red-soft:rgba(240,101,104,.14);
  --grid:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--font-ui);color:var(--text);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;height:100vh}
#rail{width:56px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--surface-2)}
.rb{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);position:relative}
.rb:hover{background:var(--hover);color:var(--text)}
.rb.on{background:var(--accent-soft);color:var(--accent)}
.rb .ic{width:19px;height:19px}
.rsub{display:flex;flex-direction:column;gap:2px;padding:2px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.rb.sm{width:32px;height:30px}
.rb.sm .ic{width:16px;height:16px}
.badge{position:absolute;top:-2px;right:-4px;min-width:15px;height:15px;border-radius:8px;background:var(--amber);color:#fff;font-size:10px;line-height:15px;text-align:center;padding:0 3px;font-style:normal}
.badge:empty{display:none}
#side{width:236px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
#side h4{margin:0;padding:10px 12px 6px;font-size:12px;color:var(--text-3);font-weight:600}
#sideList{flex:1;overflow:auto;padding:0 6px 10px}
.sp{display:flex;align-items:center;margin-top:6px}
.spn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;font-weight:600;text-align:left}
.spn span,.sr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spn:hover,.sr:hover,.eye:hover{background:var(--hover)}
.eye{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-3)}
.sr{width:100%;display:flex;align-items:center;gap:7px;padding:4px 6px 4px 22px;border-radius:6px;text-align:left}
.sr span{flex:1;min-width:0}
.sr em{font-style:normal;font-size:11px;color:var(--text-faint);flex:none}
.sr.dim{color:var(--text-faint)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:none;display:inline-block}
.dot.st-running,.dot.st-done{background:var(--green)}.dot.st-waiting{background:var(--amber)}.dot.st-draft{background:var(--accent)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:40px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface)}
#top b{font-weight:600}
#top .grow{flex:1}
.tb{height:28px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;color:var(--text-2);border:1px solid transparent;white-space:nowrap}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
#stage{flex:1;min-height:0;display:flex}
#wrap{flex:1;min-width:0;position:relative;overflow:hidden}
#canvas{position:absolute;top:0;bottom:0;left:0;right:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);cursor:default}
#canvas.grabbing,#canvas.space{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none}
.se{stroke:var(--border-strong);stroke-width:1.5}
.te{stroke:var(--text-faint);stroke-width:1.2;stroke-dasharray:2 4}
.le{stroke:var(--text-faint);stroke-width:1.4;stroke-dasharray:8 4}
.we{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 4}
.we.st-sent{stroke:var(--text-faint);opacity:.6}
.we.st-updated{stroke:var(--green)}
.we.st-always{stroke-dasharray:none}
.we.on{stroke-width:3}
.we.tmp{opacity:.7}
.hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.node{position:absolute;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;display:flex;flex-direction:column}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.node.target{box-shadow:0 0 0 3px var(--accent-border)}
.node.ref{cursor:grab}
.k-project{background:var(--surface-2);border-color:var(--accent-border)}
.k-agent,.k-sub{border-left:3px solid var(--st,var(--text-faint))}
.st-running{--st:var(--green)}.st-waiting{--st:var(--amber)}.st-draft{--st:var(--accent)}.st-done{--st:var(--green)}
.node.st-archived,.node.gone{opacity:.55;border-style:dashed}
.node.popped{border-style:dashed;background:var(--surface-2)}
.nh{display:flex;align-items:center;gap:6px;padding:7px 6px 3px 9px;flex:none;cursor:grab;min-width:0}
.nt{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;color:var(--text-3);flex:none}
.nb:hover{background:var(--hover);color:var(--text)}
.nb .ic{width:14px;height:14px}
.node.ref .nb{display:none}
.node.ref:hover .nb,.node.ref.sel .nb{display:inline-grid}
.meta{padding:0 9px 3px;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;min-height:19px}
.meta.last{color:var(--text-faint)}
.lk{color:var(--accent);font-size:12px;margin-left:auto;white-space:nowrap}
.lk:hover{text-decoration:underline}
.bar{height:3px;margin:0 9px 3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.chip-s{font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--text-3);white-space:nowrap;flex:none}
.chip-s.st-running,.chip-s.st-done{background:var(--green-soft);color:var(--green)}
.chip-s.st-waiting{background:var(--amber-soft);color:var(--amber)}
.chip-s.st-draft{background:var(--accent-soft);color:var(--accent)}
.port{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);top:min(50%,19px);margin-top:-6px;z-index:2}
.port.out{right:-7px;cursor:crosshair}
.port.out:hover{background:var(--accent)}
.port.in{left:-8px;border-color:var(--text-faint);pointer-events:none}
.port b{position:absolute;left:13px;top:-9px;font-size:10px;line-height:14px;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 5px;font-weight:600}
.fn-body{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--border);margin-top:3px}
.lod-sum{display:none}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;border-right:2px solid var(--border-strong);border-bottom:2px solid var(--border-strong);border-radius:0 0 9px 0}
.cols{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.detail{display:none;width:170px;flex:none;border-left:1px solid var(--border);padding:8px 10px;flex-direction:column;gap:4px;color:var(--text-3);font-size:12px}
.wide .detail{display:flex}
.scroll{flex:1;min-height:0;overflow:auto;padding:8px 10px;user-select:text;-webkit-user-select:text}
.msg{padding:6px 8px;border-radius:8px;margin-bottom:6px;border:1px solid transparent;cursor:pointer;word-break:break-word}
.msg.user{background:var(--accent-softer);margin-left:28px}
.msg.ai{background:var(--surface-2);margin-right:16px}
.msg.sel,.item.sel,.bcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.msg .auto{margin-top:4px;font-size:11px;color:var(--text-faint)}
.empty,.tip{color:var(--text-faint);font-size:12px}
.appr{border:1px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.appr code{font-family:var(--font-mono);font-size:12px;background:var(--surface);border-radius:5px;padding:4px 6px;user-select:text}
.row{display:flex;align-items:center;gap:6px}
.btn{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--border-strong);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--surface)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn .ic{width:13px;height:13px}
.composer{flex:none;padding:8px 10px 9px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-3)}
.opts select{height:24px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:0 4px}
.input{min-height:50px;max-height:110px;overflow:auto;border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;outline:none;user-select:text;-webkit-user-select:text;white-space:pre-wrap;word-break:break-word;cursor:text}
.input:focus{border-color:var(--accent)}
.input:empty::before{content:attr(data-ph);color:var(--text-faint)}
.tray{display:flex;flex-wrap:wrap;gap:4px;min-height:22px;align-items:center}
.cap,.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;height:21px;border:1px solid var(--accent-border);background:var(--accent-softer);border-radius:999px;font-size:12px;white-space:nowrap;max-width:100%;overflow:hidden;vertical-align:middle}
.cap{cursor:grab}
.cap .ic,.chip .ic{width:12px;height:12px}
.cap.st-sent{border-color:var(--border-strong);background:transparent;color:var(--text-faint)}
.cap.st-updated{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.cap.st-always{border-style:solid;border-width:2px}
.cap.ghost{position:fixed;z-index:99;pointer-events:none;background:var(--surface)}
.chip{margin:0 2px;user-select:none}
.ro{padding:8px 10px;border-top:1px solid var(--border);color:var(--text-faint);font-size:12px}
.pick{padding:5px 10px;font-size:11px;color:var(--text-faint);border-bottom:1px solid var(--border);flex:none}
.sum{padding:5px 10px 0;font-size:12px;color:var(--text-3);flex:none}
.list{padding:6px}
.wide .list{display:grid;grid-template-columns:1fr 1fr;gap:0 6px;align-content:start}
.item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-family:var(--font-mono);font-size:12px;min-width:0}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.bcard:hover{background:var(--hover)}
.ck{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--text-faint);flex:none}
.sel>.ck{background:var(--accent);border-color:var(--accent)}
.note-text{flex:1;min-height:0;overflow:auto;padding:8px 10px;outline:none;user-select:text;-webkit-user-select:text;white-space:pre-wrap;cursor:text}
.k-note{background:var(--amber-soft)}
.board{flex:1;min-height:0;display:flex;gap:6px;padding:8px}
.bcol{flex:1;min-width:0;background:var(--surface-2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.bcol>b{font-size:12px;color:var(--text-3)}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 4px 4px 7px;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px}
.bcard span{flex:1;min-width:0}
.badd{display:flex;gap:3px}
.badd input{flex:1;min-width:0;height:22px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);padding:0 5px;font-size:12px}
.lod .node.fn .fn-body,.lod .node.fn .rs,.lod .nb,.lod .meta.last,.lod .bar{display:none!important}
.lod .node.fn .lod-sum{display:block}
.lod .nt{font-size:calc(13px*var(--k,1))}
.lod .nh{padding-top:9px}
.group{position:absolute;border:1.5px dashed var(--gc,var(--accent-border));border-radius:14px;background:color-mix(in srgb,var(--gc,var(--accent)) 5%,transparent)}
.group.collapsed{border-style:solid;background:var(--surface)}
.gh{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;cursor:grab;color:var(--text-2)}
.gt{font-weight:600;outline:none;min-width:20px;cursor:text;white-space:nowrap}
.gm{font-size:11px;color:var(--text-faint);flex:1;white-space:nowrap}
.gh button{font-size:11px;padding:1px 6px;border-radius:5px;color:var(--text-3)}
.gh button:hover{background:var(--hover)}
#marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-softer);display:none;pointer-events:none}
#toolbar{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;pointer-events:none}
.tg{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:2px;pointer-events:auto}
.tg .tb{height:26px;padding:0 8px}
#searchBox{position:relative;pointer-events:auto}
#search{height:32px;width:170px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);padding:0 9px;outline:none;user-select:text}
#search:focus{border-color:var(--accent)}
#results{position:absolute;top:35px;left:0;width:240px;background:var(--surface);border:1px solid var(--border-float);border-radius:9px;padding:4px;display:none;z-index:5}
#results button{display:flex;gap:6px;align-items:center;width:100%;text-align:left;padding:5px 7px;border-radius:6px}
#results button:hover{background:var(--hover)}
#results em{font-style:normal;color:var(--text-faint);font-size:11px;margin-left:auto}
#indicators{position:absolute;inset:0;pointer-events:none}
.ind{position:absolute;pointer-events:auto;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:var(--amber);color:#fff;font-size:12px;white-space:nowrap}
.ind i{display:inline-grid}
#minimap{position:absolute;right:10px;bottom:10px;width:192px;height:122px;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;cursor:pointer}
#minimap rect{fill:var(--text-faint);opacity:.55}
#minimap .mk-project{fill:var(--accent);opacity:.8}
#minimap .ms-running{fill:var(--green);opacity:.9}
#minimap .ms-waiting{fill:var(--amber);opacity:1}
#minimap .mvp{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;opacity:1}
#hint{position:absolute;left:10px;bottom:10px;width:292px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--text-2)}
#hint b{display:flex;align-items:center;justify-content:space-between;color:var(--text)}
#hint ol{margin:6px 0 0;padding-left:18px;line-height:1.7}
#hint.min ol{display:none}
#hint kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:0 4px}
#snapPrev{position:absolute;top:0;bottom:0;width:50%;background:var(--accent-soft);border:2px solid var(--accent-border);display:none;pointer-events:none;z-index:3}
#snapPrev.on{display:block}#snapPrev.left{left:0}#snapPrev.right{right:0}#snapPrev.max{left:0;width:100%}
#windows{position:absolute;inset:0;pointer-events:none;z-index:4}
.win{position:absolute;background:var(--surface);border:1px solid var(--border-float);border-radius:10px;display:flex;flex-direction:column;pointer-events:auto;overflow:hidden}
.win.snapped{border-radius:0}
.wh{height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;background:var(--surface-2);cursor:grab;border-bottom:1px solid var(--border)}
.wh .nt{font-weight:600}
.wb{flex:1;min-height:0;display:flex;flex-direction:column}
#rightbar{width:0;flex:none;border-left:1px solid var(--border);background:var(--surface);overflow:hidden}
#rightbar.open{width:250px;padding:10px 12px}
#bottombar{height:0;flex:none;border-top:1px solid var(--border);background:var(--surface);overflow:hidden;font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
#bottombar.open{height:130px;padding:8px 12px}
#convo{position:absolute;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;color:var(--text-2);z-index:8;padding:30px}
#convo.on{display:grid}
#menu{position:fixed;z-index:50;min-width:176px;background:var(--surface);border:1px solid var(--border-float);border-radius:9px;padding:4px;display:none}
#menu button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 9px;border-radius:6px;white-space:nowrap}
#menu button:hover{background:var(--hover)}
#menu hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
#menu small{display:block;padding:4px 9px;color:var(--text-faint)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:9px;font-size:12px;display:none;z-index:60;max-width:70vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="主导航"></nav>
  <aside id="side"><h4>项目与会话</h4><div id="sideList"></div></aside>
  <main id="main">
    <header id="top"></header>
    <div id="stage">
      <div id="wrap">
        <div id="canvas">
          <div id="world"><div id="groups"></div><svg id="edges"></svg><div id="nodes"></div></div>
          <div id="marquee"></div>
          <div id="indicators"></div>
          <div id="toolbar"></div>
          <div id="minimap" title="小地图：点击或拖动移动视口"></div>
          <div id="hint"></div>
        </div>
        <div id="snapPrev"></div>
        <div id="windows"></div>
        <div id="convo"><div><p><b>对话模式</b>（现有界面，原型未包含）</p><p>在对话模式里，「引用」动作直接进入当前输入框；<br>回到画布，同样的动作变成「选中为引用」，再用连线决定交给哪个 Agent。</p><button class="btn pri" data-cmd="mode-canvas">返回画布</button></div></div>
      </div>
      <aside id="rightbar"></aside>
    </div>
    <div id="bottombar"></div>
  </main>
</div>
<div id="menu"></div>
<div id="toast" role="status"></div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const p = n.parent && N.get(n.parent); let to = null;
  if (key === 'ArrowLeft') to = p;
  else if (key === 'ArrowRight') {
    if (n.kind === 'agent' && !n.subsOpen && subsOf(n).length) { n.subsOpen = true; n.dirty = true; relayout(); }
    to = kids(n)[0];
  } else {
    const sib = !p ? [...N.values()].filter(x => x.kind === 'project' && !x.off) : STRUCT.has(n.kind) ? kids(p) : [];
    to = sib[sib.indexOf(n) + (key === 'ArrowDown' ? 1 : -1)];
  }
  if (!to || !shown(to)) return;
  S.sel.clear(); S.sel.add(to.id); S.chrome = true; ensureVisible(to);
}

/* ---------- chrome ---------- */
function buildChrome() {
  $('#rail').innerHTML = `<button class="rb on" title="工作台">${ic('bench')}</button><div class="rsub"><button class="rb sm" data-cmd="mode-chat" id="mChat" title="工作台 · 对话">${ic('chat')}</button><button class="rb sm on" data-cmd="mode-canvas" id="mCanvas" title="工作台 · 画布">${ic('canvas')}<i class="badge" id="railBadge"></i></button></div>`
    + [['home', '首页'], ['clock', '会话历史'], ['box', '能力中心'], ['server', '模型配置'], ['gear', '设置']].map(([i, t]) => `<button class="rb" title="${t}（原型未包含）">${ic(i)}</button>`).join('');
  $('#top').innerHTML = `<b>工作台</b><span style="color:var(--text-faint)">/</span><span id="crumb">画布</span><span class="grow"></span><button class="tb" data-cmd="right" id="bRight" title="右侧栏：进画布默认收起，内容跟随选中的 Agent">${ic('side')}右侧栏</button><button class="tb" data-cmd="bottom" id="bBottom" title="底栏：进画布默认收起">${ic('bottom')}底栏</button><button class="tb" data-cmd="theme" title="切换深浅主题">${ic('moon')}</button>`;
  $('#toolbar').innerHTML = `<div class="tg" id="filters">${[['auto', '自动'], ['running', '仅运行'], ['3d', '3 天内'], ['7d', '7 天内'], ['all', '全部']].map(([f, t]) => `<button class="tb" data-cmd="filter" data-f="${f}">${t}</button>`).join('')}</div>`
    + `<div class="tg"><button class="tb" data-cmd="add" title="添加节点（也可以右键空白处）">${ic('plus')}添加</button><button class="tb" data-cmd="tidy" title="整理：只重排没拖过的节点。按住 Shift 点击 = 全部解除固定后重排">${ic('tidy')}整理</button><button class="tb" data-cmd="group" title="把选中的节点圈成一组（G）">${ic('group')}分组</button></div>`
    + `<div class="tg"><button class="tb" data-cmd="fit" title="适应视图（F）；Shift+F 只看选中的那棵树">${ic('fit')}</button><button class="tb" data-cmd="zoom100" id="zoomLbl" title="点击回到 100%（0）">100%</button><button class="tb" data-cmd="undo" title="撤销（Ctrl+Z）">${ic('undo')}</button><button class="tb" data-cmd="redo" title="重做（Ctrl+Shift+Z）">${ic('redo')}</button></div>`
    + '<div id="searchBox"><input id="search" placeholder="搜索节点（Ctrl+F）" autocomplete="off"><div id="results"></div></div>'
    + `<div class="tg"><button class="tb" data-cmd="settings" title="原型设置与模拟">${ic('gear')}设置</button></div>`;
  $('#hint').innerHTML = '<b>可以试试<button class="lk" data-cmd="hint">收起 / 展开</button></b><ol>'
    + '<li>滚轮缩放，拖空白平移；缩到 55% 以下节点自动降级</li>'
    + '<li>双击节点标题：引用卡 ↔ 功能卡；右下角拖动改尺寸</li>'
    + '<li>双击空白：新建 Agent 草稿</li>'
    + '<li>从节点右侧圆点拉线到 Agent；拉到空白处是另一组菜单</li>'
    + '<li>展开 Agent：把胶囊拖进输入框，或直接发送让它自动带上</li>'
    + '<li>展开「文件」节点点选条目，圆点出现数字后再拉线</li>'
    + '<li>按住 <kbd>Alt</kbd> 拖节点：弹出为窗口，拖到左右边缘吸附</li>'
    + '<li><kbd>Shift</kbd> 拖框选，<kbd>G</kbd> 分组，再折叠这个组</li>'
    + '<li>方向键沿树移动，<kbd>F</kbd> 适应视图，<kbd>Ctrl</kbd>+<kbd>F</kbd> 搜索，<kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销</li>'
    + '<li>右键节点或空白处看更多；「设置」里可以模拟屏外等待</li></ol>';
}
function drawChrome() {
  for (const b of $$('#filters .tb')) b.classList.toggle('on', b.dataset.f === S.filter);
  $('#bRight').classList.toggle('on', S.right); $('#bBottom').classList.toggle('on', S.bottom);
  $('#rightbar').classList.toggle('open', S.right); $('#bottombar').classList.toggle('open', S.bottom);
  let h = '';
  for (const p of N.values()) {
    if (p.kind !== 'project') continue;
    h += `<div class="sp"><button class="spn" data-reveal="${p.id}">${ic('project')}<span>${esc(p.title)}</span></button><button class="eye" data-eye="${p.id}" title="${p.off ? '在画布上显示这个项目' : '从画布上隐藏这个项目'}">${ic(p.off ? 'eyeoff' : 'eye')}</button></div>`;
    for (const s of N.values()) {
      if (s.kind !== 'agent' || s.status === 'draft' || projectOf(s) !== p) continue;
      h += `<button class="sr${shown(s) ? '' : ' dim'}" data-reveal="${s.id}" title="${shown(s) ? '飞到这个节点' : '不在当前筛选里，点击加入画布'}"><i class="dot st-${s.status}"></i><span>${esc(s.title)}</span><em>${s.age ? s.age + ' 天前' : '今天'}</em></button>`;
    }
  }
  $('#sideList').innerHTML = h;
  const sel = S.sel.size === 1 ? N.get([...S.sel][0]) : null, f = sel ? follow(sel) : null;
  $('#rightbar').innerHTML = '<b>右侧栏</b><p class="tip">进画布时默认收起，内容跟随选中的 Agent。</p>'
    + (f ? `<p>${esc(f.title)}</p><p class="tip">Context · Changes · Git 快捷卡<br>状态：${ST[f.status] || ''}<br>模型：${esc(f.model || '')}</p>` : '<p class="tip">没有选中 Agent。</p>');
  $('#bottombar').innerHTML = `Terminal · ${f ? esc(projectOf(f).title) : '未选中项目'}<br>PS&gt; _`;
}
function applyTheme() { document.documentElement.dataset.theme = S.theme; }
function doCmd(c, el, e) {
  switch (c) {
    case 'filter': S.filter = el.dataset.f; markAll(); relayout(); commit(); break;
    case 'tidy':
      snapshot();
      if (e.shiftKey) for (const n of N.values()) if (STRUCT.has(n.kind)) n.pinned = false;
      markAll(); relayout(); commit(); toast(e.shiftKey ? '已全部解除固定并重排' : '已整理：拖过的节点保持不动（Shift + 点击可全部重排）');
      break;
    case 'group': groupSel(); break;
    case 'fit': if (e.shiftKey) fitSel(); else fitAll(); break;
    case 'zoom100': { const r = canvas.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / S.view.z); break; }
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); break;
    case 'right': S.right = !S.right; commit(); break;
    case 'bottom': S.bottom = !S.bottom; commit(); break;
    case 'hint': $('#hint').classList.toggle('min'); break;
    case 'mode-chat': case 'mode-canvas': {
      const chat = c === 'mode-chat';
      $('#convo').classList.toggle('on', chat); $('#mChat').classList.toggle('on', chat); $('#mCanvas').classList.toggle('on', !chat); $('#crumb').textContent = chat ? '对话' : '画布';
      break;
    }
    case 'add': { const r = el.getBoundingClientRect(), q = canvas.getBoundingClientRect(); blankMenu({ x: r.left, y: r.bottom + 4 }, toWorld(q.left + q.width / 2 - 100, q.top + q.height / 2 - 60)); break; }
    case 'settings': { const r = el.getBoundingClientRect(); settingsMenu({ x: r.left, y: r.bottom + 4 }); break; }
  }
}
function doAct(act, n, el, e) {
  const blur = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); };
  if (act === 'g-collapse' || act === 'g-ungroup') {
    const g = S.groups.find(x => x.id === el.dataset.g); if (!g) return;
    snapshot(); if (act === 'g-collapse') g.collapsed = !g.collapsed; else S.groups = S.groups.filter(x => x !== g);
    blur(); markAll(); return commit();
  }
  if (!n) return;
  switch (act) {
    case 'form': return toggleForm(n);
    case 'pop': return popOut(n);
    case 'unpop': return unpop(n);
    case 'more': return nodeMenu(n, { x: e.clientX, y: e.clientY });
    case 'subs': n.subsOpen = !n.subsOpen; n.dirty = true; relayout(); return commit();
    case 'unpin': snapshot(); n.pinned = false; n.dirty = true; relayout(); return commit();
    case 'send': return send(n, el.closest('.composer'));
    case 'approve': return decide(n, true);
    case 'deny': return decide(n, false);
    case 'bmove': { const c = el.closest('.bcard'), ci = +c.dataset.ci, ki = +c.dataset.ki; snapshot(); n.cols[ci + 1].cards.push(n.cols[ci].cards.splice(ki, 1)[0]); n.dirty = true; return commit(); }
    case 'badd': { const inp = $('input', el.closest('.badd')), v = inp.value.trim(); if (!v) return; snapshot(); n.cols[0].cards.push({ t: v }); blur(); n.dirty = true; return commit(); }
  }
}

/* ---------- events ---------- */
document.addEventListener('pointerdown', e => {
  if (!e.target.closest) return;
  if (!e.target.closest('#menu')) closeMenu();
  if (!e.target.closest('#searchBox')) $('#results').style.display = 'none';
}, true);
canvas.addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  const t = e.target;
  if (t.closest('#toolbar,#minimap,#hint,.ind')) return;
  if (e.button === 1 || S.space) { e.preventDefault(); return startPan(e); }
  const hit = t.closest('.hit');
  if (hit) { S.selWire = hit.dataset.wire; S.sel.clear(); draw(); return wireMenu(hit.dataset.wire, { x: e.clientX, y: e.clientY }); }
  const port = t.closest('.port.out'); if (port) { e.preventDefault(); return startWire(e, N.get(port.dataset.port)); }
  const rs = t.closest('.rs'); if (rs) { e.preventDefault(); return startResize(e, N.get(rs.dataset.rs)); }
  const cap = t.closest('.tray .cap'); if (cap) return startCapDrag(e, cap);
  const gh = t.closest('.gh');
  if (gh) { const g = S.groups.find(x => x.id === gh.dataset.g); if (g && !t.closest('button,.gt')) dragNodes(e, g.members.filter(m => N.has(m))); return; }
  const ne = t.closest('.node');
  if (ne) {
    const n = N.get(ne.dataset.id);
    if (t.closest('button,input,select,label,.input,.note-text,.scroll,.tray,.board')) return pick(n, e);
    return startMove(e, n);
  }
  if (e.shiftKey) return startMarquee(e);
  startPan(e);
});
winsEl.addEventListener('pointerdown', e => {
  const t = e.target, we = t.closest('.win'); if (!we) return;
  const n = N.get(we.dataset.id); if (!n) return;
  if (we !== winsEl.lastElementChild && !t.closest('button,.input,.cap')) winsEl.append(we);
  const cap = t.closest('.tray .cap'); if (cap) return startCapDrag(e, cap);
  if (t.closest('.wh') && !t.closest('button')) { e.preventDefault(); startWinDrag(e, n, false); }
});
canvas.addEventListener('dblclick', e => {
  const t = e.target;
  if (t.closest('#toolbar,#minimap,#hint,.ind,.group')) return;
  const ne = t.closest('.node');
  if (ne) { if (!t.closest('button,.fn-body,.port,.rs')) toggleForm(N.get(ne.dataset.id)); return; }
  const [wx, wy] = toWorld(e.clientX, e.clientY); createAgent(wx - 60, wy - 20);
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const t = e.target; if (t.closest('#toolbar,#minimap,#hint')) return;
  const ne = t.closest('.node'), pt = { x: e.clientX, y: e.clientY };
  if (ne) { const n = N.get(ne.dataset.id); pick(n, e); nodeMenu(n, pt); } else blankMenu(pt);
});
canvas.addEventListener('wheel', e => {
  if (e.target.closest('#toolbar,#hint')) return;
  if (!e.ctrlKey && !world.classList.contains('lod') && e.target.closest('.node.fn')) return;
  e.preventDefault();
  if (S.wheel === 'pan' && !e.ctrlKey) { S.view.x -= e.deltaX; S.view.y -= e.deltaY; return draw(); }
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
}, { passive: false });
mini.addEventListener('pointerdown', e => {
  e.preventDefault(); const m = mini._m; if (!m) return;
  const go = ev => { const r = mini.getBoundingClientRect(), q = canvas.getBoundingClientRect(); S.view.x = q.width / 2 - (m.all.x + (ev.clientX - r.left) / m.k) * S.view.z; S.view.y = q.height / 2 - (m.all.y + (ev.clientY - r.top) / m.k) * S.view.z; draw(); };
  go(e); track(go);
});
document.addEventListener('click', e => {
  const t = e.target; if (!t.closest) return;
  const act = t.closest('[data-act]');
  if (act) { const host = act.closest('[data-id]'); return doAct(act.dataset.act, host ? N.get(host.dataset.id) : null, act, e); }
  const fly = t.closest('[data-fly]');
  if (fly) { const n = N.get(fly.dataset.fly); if (n) { S.sel.clear(); S.sel.add(n.id); flyTo(n); } return; }
  const rv = t.closest('[data-reveal]'); if (rv) { $('#results').style.display = 'none'; return reveal(N.get(rv.dataset.reveal)); }
  const eye = t.closest('[data-eye]'); if (eye) { const p = N.get(eye.dataset.eye); p.off = !p.off; markAll(); relayout(); return commit(); }
  const cmd = t.closest('[data-cmd]'); if (cmd) return doCmd(cmd.dataset.cmd, cmd, e);
  const host = t.closest('[data-id]'), n = host && N.get(host.dataset.id); if (!n) return;
  const item = t.closest('.item'); if (item && n.items) { const it = n.items[+item.dataset.item]; it.sel = !it.sel; n.dirty = true; return commit(); }
  const bc = t.closest('.bcard'); if (bc && n.cols) { const k = n.cols[+bc.dataset.ci].cards[+bc.dataset.ki]; k.sel = !k.sel; n.dirty = true; return commit(); }
  const msg = t.closest('.msg'); if (msg && n.msgs) { const m = n.msgs[+msg.dataset.msg]; m.sel = !m.sel; n.dirty = true; return commit(); }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.matches) return;
  if (t.matches('.input')) {
    const n = N.get(t.dataset.input); if (!n) return;
    n.draftHtml = t.innerHTML;
    const ids = new Set($$('.chip', t).map(c => c.dataset.cap));
    for (const { c } of capsFor(n.id)) c.placed = ids.has(c.id);
    refreshTrays(n.id); save();
  } else if (t.matches('.note-text')) { const h = t.closest('[data-id]'), n = h && N.get(h.dataset.id); if (n) { n.text = t.textContent; save(); } }
  else if (t.matches('.gt')) { const g = S.groups.find(x => x.id === t.dataset.gt); if (g) { g.title = t.textContent; save(); } }
  else if (t.id === 'search') doSearch(t.value);
});
document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('.gt,.note-text')) setTimeout(() => { markAll(); draw(); }, 0); });
window.addEventListener('keydown', e => {
  const t = e.target, typing = t && t.closest && t.closest('input,select,[contenteditable]'), mod = e.ctrlKey || e.metaKey, k = e.key;
  if (k === 'Escape') {
    closeMenu(); $('#results').style.display = 'none';
    if (typing) t.blur(); else { S.sel.clear(); S.selWire = null; S.chrome = true; draw(); }
    return;
  }
  if (mod && k.toLowerCase() === 'f') { e.preventDefault(); $('#search').focus(); $('#search').select(); return; }
  if (typing) {
    if (k !== 'Enter') return;
    if (!e.shiftKey && t.matches('.input')) { e.preventDefault(); const h = t.closest('[data-id]'); send(N.get(h.dataset.id), t.closest('.composer')); }
    else if (t.id === 'search') { const b = $('#results button'); if (b) b.click(); }
    else if (t.closest('.badd')) $('[data-act="badd"]', t.closest('.badd')).click();
    else if (t.matches('.gt')) { e.preventDefault(); t.blur(); }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); S.space = true; canvas.classList.add('space'); return; }
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod) return;
  if (k === 'f' || k === 'F') { if (e.shiftKey) fitSel(); else fitAll(); return; }
  if (k === 'g' || k === 'G') return groupSel();
  if (k === '0') return doCmd('zoom100', null, e);
  if (k === 'Delete' || k === 'Backspace') return deleteSel();
  if (k === 'Enter' && S.sel.size === 1) return toggleForm(N.get([...S.sel][0]));
  if (k.startsWith('Arrow')) { e.preventDefault(); navTree(k); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { S.space = false; canvas.classList.remove('space'); } });
window.addEventListener('resize', () => draw());

/* ---------- persistence and init ---------- */
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify({ d: snapState(), view: S.view, filter: S.filter, theme: S.theme, wheel: S.wheel, cap: S.cap })); } catch (err) { /* storage unavailable */ }
  }, 400);
}
function load() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return false;
    const o = JSON.parse(raw), d = JSON.parse(o.d);
    for (const n of d.nodes) { n.dirty = true; N.set(n.id, n); }
    S.wires = d.wires; S.groups = d.groups; Object.assign(S.view, o.view);
    S.filter = o.filter || 'auto'; S.theme = o.theme || 'light'; S.wheel = o.wheel || 'zoom'; S.cap = o.cap || 4;
    return N.size > 0;
  } catch (err) { return false; }
}
buildChrome();
const fresh = !load();
if (fresh) seed();
applyTheme(); commit();
if (fresh) fitAll(true);
setInterval(tick, 1500);
window.__canvas = { S, N, hist, api: { seed, layout: relayout, commit, draw, connect, addWire, buildCaps, send, tick, toggleForm, createAgent, spawnSub, handoff, fork, popOut, unpop, groupSel, deleteSel, removeNode, undo, redo, fitAll, reveal, doSearch, navTree, doCmd, doAct, simWait, resetDemo, shown, box, capsFor } };
})();
</script>
