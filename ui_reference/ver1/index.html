<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMP Studio — 工作台</title>
<!-- 单 HTML 壳：工作台（.app）与二级页（.page）两个常驻根，路由只换
     内容。全部样式一次载入；各二级页视图的静态体在下方 <template> 里。 -->
<link rel="stylesheet" href="assets/css/tokens.css?v=6">
<link rel="stylesheet" href="assets/css/base.css?v=2">
<link rel="stylesheet" href="assets/css/components.css?v=3">
<link rel="stylesheet" href="assets/css/sidebar.css?v=7">
<link rel="stylesheet" href="assets/css/workbench.css?v=30">
<link rel="stylesheet" href="assets/css/pages.css?v=8">
<link rel="stylesheet" href="assets/css/models-roles.css?v=10">
<link rel="stylesheet" href="assets/css/agent-hub.css?v=4">
</head>
<body data-page="workbench">
<!-- 工作台 skip link：侧栏与顶栏有 ~40 个可聚焦控件挡在对话前。 -->
<a class="skip-link" href="#convoScroll">跳到对话内容</a>

<!-- ================= 工作台根（常驻） ================= -->
<div class="app" id="appRoot">

  <!-- ================= 复合侧栏 ================= -->
  <aside class="sidebar" id="sidebar" aria-label="项目与文件侧栏">
    <div class="sidebar-resizer" id="sbResizer"></div>

    <!-- 左上操作区：纯工具栏（汉堡 + 品牌 + 搜索）。
         任务级常驻 action（新建对话 / 技能 & 插件）独立到下一行 .sb-actions，
         与「项目与对话」h2 同级但保持一行内的明确分隔。 -->
    <div class="sb-top">
      <button class="icon-btn" id="btnAppMenu" data-tip="应用菜单"><svg class="icon" data-icon="menu"></svg></button>
      <!-- Was a <div> with a click handler: not focusable, not announced as a
           control, and unreachable without a mouse. -->
      <button class="sb-brand" id="brandHome" data-tip="项目主页">
        <span class="logo" aria-hidden="true">π</span>
        <span class="name">OMP Studio</span>
      </button>
      <button class="icon-btn" id="btnSearch" data-tip="统一搜索 (Ctrl K)"><svg class="icon" data-icon="search"></svg></button>
    </div>

    <!-- 任务级常驻 action：两行 ghost row（对齐 Codex 截图）
         行 1 = [+] 新建对话（整行宽，加号 accent 色）
         行 2 = [⊞] 技能 & 插件 (n) →（toggle，选中态行底色 accent-soft）
         位于 .sb-top 与「项目与对话」h2 之间，视觉重量低于 h2。 -->
    <div class="sb-actions">
      <button class="action-row new-convo-btn" id="btnNewConvo" data-tip="新建对话 (Ctrl Shift O)"
              aria-label="新建对话">
        <svg class="icon" data-icon="plus" aria-hidden="true"></svg>
        <span class="lbl">新建对话</span>
        <span class="meta"><span class="hint">Ctrl ⇧ O</span></span>
      </button>
      <button class="action-row skills-btn" id="btnSkills" data-tip="技能与插件 (Ctrl Shift K)"
              aria-label="技能与插件"
              aria-expanded="false" aria-controls="skillsDrawer">
        <svg class="icon" data-icon="layers" aria-hidden="true"></svg>
        <span class="lbl">技能 &amp; 插件</span>
        <span class="meta">
          <span class="count" id="skillsBadge">0</span>
          <svg class="icon sm chev" data-icon="chevron-r" aria-hidden="true"></svg>
        </span>
      </button>
    </div>

    <!-- 项目与对话 -->
    <section class="sb-section" id="sbProjects" aria-labelledby="sbProjectsTitle">
      <div class="sb-section-head">
        <h2 id="sbProjectsTitle">项目与对话</h2>
        <!-- 项目区固定不折叠（对齐 Codex）：仅一个「新建项目」，悬停标题栏显示 -->
        <div class="sb-head-actions">
          <button class="icon-btn" id="btnNewProject" data-tip="新建项目"><svg class="icon sm" data-icon="plus"></svg></button>
        </div>
      </div>
      <div class="sb-scroll" id="projectList"></div>
    </section>

    <!-- 可拖分隔条 -->
    <div class="sb-divider" id="sbDivider" data-tip="拖动调整 · 双击平分 · 方向键微调"></div>

    <!-- 文件树 -->
    <section class="sb-section" id="sbFiles" aria-labelledby="sbFilesTitle">
      <div class="sb-section-head">
        <h2 id="sbFilesTitle">Explorer</h2>
        <!-- hover 显示：新建文件 · 新建目录 · 搜索文件 · 刷新 -->
        <div class="sb-head-actions">
          <button class="icon-btn" data-tip="新建文件"><svg class="icon sm" data-icon="plus"></svg></button>
          <button class="icon-btn" data-tip="新建目录"><svg class="icon sm" data-icon="folder"></svg></button>
          <button class="icon-btn" data-tip="搜索文件"><svg class="icon sm" data-icon="search"></svg></button>
          <button class="icon-btn" data-tip="刷新"><svg class="icon sm" data-icon="refresh"></svg></button>
        </div>
        <!-- 常驻：收起/展开（最右侧，不在 hover 组内） -->
        <button class="icon-btn" id="btnCollapseFiles" data-tip="收起 Explorer"><svg class="icon sm" data-icon="chevron-d"></svg></button>
      </div>
      <div class="sb-scroll">
        <div class="tree" id="fileTree"></div>
      </div>
    </section>

    <!-- ================= 技能 & 插件 抽屉面板 =================
         覆盖 .sb-actions（两枚 action 行）+ .sb-section 区域，
         不覆盖 .sb-top 与 .sb-footer。
         JS 通过 --drawer-top / --drawer-bottom 钉到两者下/上沿。 -->
    <aside class="sb-drawer-mask" id="skillsDrawer"
           role="dialog" aria-modal="false"
           aria-labelledby="sdTitle" aria-hidden="true" hidden>

      <div class="sd-head">
        <div class="sd-title">
          <svg class="icon sm" data-icon="layers" aria-hidden="true"></svg>
          技能 &amp; 插件
          <span class="count" id="sdCount">0</span>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn small" id="sdOpenHub" data-tip="打开能力中心"
                aria-label="打开能力中心">
          <svg class="icon sm" data-icon="external" aria-hidden="true"></svg>
        </button>
        <button class="icon-btn small" id="sdClose" data-tip="关闭 (Esc)"
                aria-label="关闭技能面板">
          <svg class="icon sm" data-icon="x" aria-hidden="true"></svg>
        </button>
      </div>

      <label class="sd-search">
        <svg class="icon sm" data-icon="search" aria-hidden="true"></svg>
        <input id="sdSearchInput" type="text"
               placeholder="搜索技能 / 插件…"
               aria-label="在技能与插件中搜索">
        <span class="kbd">/</span>
      </label>

      <nav class="sd-tabs" role="tablist" aria-label="技能分类">
        <button class="sd-tab active" role="tab" aria-selected="true" data-cat="all">全部 <span class="count">0</span></button>
        <button class="sd-tab" role="tab" aria-selected="false" data-cat="skill">技能 <span class="count">0</span></button>
        <button class="sd-tab" role="tab" aria-selected="false" data-cat="plugin">插件 <span class="count">0</span></button>
      </nav>

      <div class="sd-body" id="sdBody" tabindex="-1">
        <!-- 卡片由 app.js 的 skillsDrawer 模块渲染 -->
      </div>

      <div class="sd-foot">
        <a class="sd-foot-link" href="#!capabilities"
           aria-label="进入能力中心（管理全部技能与插件）">
          <svg class="icon" data-icon="package" aria-hidden="true"></svg>
          <span class="label">进入能力中心</span>
          <span class="kbd">⌘ K → 技能</span>
        </a>
      </div>
    </aside>

    <!-- 左下用户与 OMP 状态 -->
    <footer class="sb-footer">
      <button class="sb-user" id="btnOmpMenu" aria-label="snowpear · OMP 状态与环境菜单">
        <span class="avatar" aria-hidden="true">S</span>
        <span>
          <span class="u-name">snowpear</span>
          <!-- OMP connection state changes on its own (reconnect, run start), so
               it is announced politely rather than only repainted. -->
          <span class="u-status ok" id="ompStatusLine" role="status" aria-live="polite">
            <span class="dot green pulse" id="ompStatusDot" aria-hidden="true"></span><span id="ompStatusText">OMP Ready</span>
          </span>
        </span>
        <svg class="icon sm" data-icon="chevron-ud" aria-hidden="true"></svg>
      </button>
    </footer>
  </aside>

  <!-- ================= 主区域 ================= -->
  <div class="main-col">

    <!-- 顶部工作区栏 -->
    <header class="topbar">
      <button class="icon-btn" id="btnToggleSidebar" data-tip="收起侧栏 (Ctrl B)"><svg class="icon" data-icon="layout"></svg></button>
      <!-- Breadcrumb: project › branch › thread, ver2-style. Each segment is a
           real button; project/branch/thread each open a menu, and the branch
           menu carries the ahead/behind + dirty detail. -->
      <div class="tb-left">
        <nav class="tb-crumb" aria-label="当前位置">
          <button class="crumb-item" id="tbProject" data-tip="切换项目" aria-haspopup="true" aria-expanded="false">
            <svg class="icon sm" data-icon="folder-open" aria-hidden="true"></svg>
            <span id="tbProjectName">omp-web</span>
            <svg class="icon sm crumb-chevron" data-icon="chevron-d" aria-hidden="true"></svg>
          </button>
          <span class="crumb-sep" aria-hidden="true">›</span>
          <button class="crumb-item" id="tbBranch" data-tip="查看分支详情" aria-haspopup="true" aria-expanded="false">
            <svg class="icon sm" data-icon="branch" aria-hidden="true"></svg>
            <span id="tbBranchName">main</span>
            <span class="dot amber" id="tbBranchDot" data-tip="3 个未提交修改"></span>
          </button>
          <span class="crumb-sep" aria-hidden="true">›</span>
          <button class="crumb-item crumb-current" id="tbThread" data-tip="对话选项" aria-haspopup="true" aria-expanded="false">
            <span class="ellipsis" id="tbThreadName" title="跟踪上游 pi-web 更新到 omp-web">跟踪上游 pi-web 更新到 omp-web</span>
            <svg class="icon sm crumb-chevron" data-icon="chevron-d" aria-hidden="true"></svg>
          </button>
        </nav>
        <!-- Fork / Handoff：贴对话名右侧，随面包屑流动，不推到最右 -->
        <button class="icon-btn" data-tip="Fork 对话" id="btnFork"><svg class="icon" data-icon="fork"></svg></button>
        <button class="icon-btn" data-tip="Handoff 到新 Thread" id="btnHandoff"><svg class="icon" data-icon="handoff"></svg></button>
      </div>
      <!-- Agent Hub 加大，其后跟会话历史 -->
      <button class="icon-btn lg" data-tip="Agent Hub" id="btnAgentHub"><svg class="icon lg" data-icon="bot"></svg></button>
      <button class="icon-btn" data-tip="会话历史" id="btnHistory"><svg class="icon" data-icon="history"></svg></button>

      <div class="tb-right">
        <!-- Session Telemetry（紧凑）：Token 与 Context 分区独立点击
             Both groups open a detail popover on click, so they were interactive
             <span>s: no focus, no keyboard, no announced role. They are buttons
             now. The outer wrapper kept cursor:pointer without a handler of its
             own, which advertised a click that did nothing — dropped. -->
        <div class="telemetry" id="telemetry">
          <button class="t-group" id="tgTokens" aria-haspopup="true" aria-expanded="false"
                  data-tip="输入 / 输出 Token 详情" aria-label="Token 用量：输入 3.5M，输出 73k，缓存 36.6M。展开详情">
            <span class="t-item"><svg class="icon sm" data-icon="arrow-u" aria-hidden="true"></svg><b>3.5M</b></span>
            <span class="t-item"><svg class="icon sm" data-icon="arrow-d" aria-hidden="true"></svg><b>73k</b></span>
            <span class="t-sep" aria-hidden="true"></span>
            <span class="t-item"><b>36.6M</b>&nbsp;cache</span>
          </button>
          <span class="t-sep" aria-hidden="true"></span>
          <!-- The ring is a pure-colour gauge; role="img" + a name is what makes
               the 22% legible without seeing it. -->
          <button class="t-group" id="tgCtx" aria-haspopup="true" aria-expanded="false"
                  data-tip="Context 构成" aria-label="Context 已使用 22%，上限 1.0M。展开构成明细">
            <span class="ctx-ring" style="--p:22" aria-hidden="true"></span>
            <span class="t-item"><b>22%</b>/1.0M</span>
          </button>
          <span class="t-sep" aria-hidden="true"></span>
          <span class="t-item"><b>auto</b>&nbsp;compact</span>
          <button class="tb-compact" id="btnCompact" data-tip="立即压缩当前会话上下文">
            <svg class="icon sm" data-icon="minimize" aria-hidden="true"></svg>Compact
          </button>
        </div>

        <button class="icon-btn" id="btnLayout" data-tip="展开 / 收起右侧面板" aria-controls="sidePanel" aria-expanded="false"><svg class="icon" data-icon="panel"></svg></button>
        <button class="icon-btn" data-action="toggle-theme" data-tip="切换 Light / Dark">
          <svg class="icon" data-theme-icon data-icon="light"></svg>
        </button>
        <a class="icon-btn" href="#!home" data-tip="项目主页"><svg class="icon" data-icon="home"></svg></a>
      </div>
    </header>

    <!-- 全局异常横幅（OMP 断开重连等，默认隐藏）
         role="alert" so a connection drop is announced when it appears rather
         than only repainted. The dismiss button gets an explicit label because
         "忽略" alone does not say what is being ignored. -->
    <div class="banner amber hidden" id="globalBanner" role="alert">
      <svg class="icon" data-icon="alert" aria-hidden="true"></svg>
      <span><b>OMP Reconnecting</b> · <span class="banner-detail">与 OMP Bridge 的连接中断，正在自动重连（第 2 次尝试）…</span></span>
      <div class="banner-actions">
        <button class="btn small outline" id="bannerDiagnose">打开诊断中心</button>
        <button class="btn small" id="bannerDismiss" aria-label="忽略此连接警告">忽略</button>
      </div>
    </div>

    <!-- 主工作区 -->
    <div class="workbench" id="workbench">
      <div class="convo-wrap">
        <!-- The conversation is the page's main content, so it carries <main>
             (the skip link targets it) and is focusable via tabindex="-1" so the
             skip link can actually move focus here, not just scroll. The log
             role announces streamed events as they arrive. -->
        <main class="convo-scroll" id="convoScroll" tabindex="-1" aria-label="对话内容">
          <div class="convo-doc" id="convoDoc" role="log" aria-live="polite" aria-relevant="additions"></div>
          <div class="turn-live hidden" id="turnLive" role="status" aria-live="off" aria-label="运行状态">
            <span class="turn-live-icon" aria-hidden="true"><svg class="icon sm" data-icon="sparkles"></svg></span>
            <span id="turnLiveVerb">thinking…</span>
          </div>
        </main>

        <!-- Conversation Minimap: a scroll/navigation aid that duplicates what
             the conversation already exposes, and its 8px dots are not usable
             targets without a pointer. Hidden from the a11y tree rather than
             half-exposed; the two tool buttons stay reachable below. -->
        <div class="minimap" id="minimap">
          <div class="minimap-track" id="mmTrack" aria-hidden="true"></div>
          <!-- 视口位置指示条：跟随对话滚动，标示当前视口在整段对话中的位置 -->
          <div class="mm-viewport" id="mmViewport" aria-hidden="true"></div>
          <div class="minimap-tools">
            <button class="icon-btn" data-tip="筛选事件" id="mmFilter" aria-haspopup="true" aria-expanded="false"><svg class="icon sm" data-icon="filter"></svg></button>
            <button class="icon-btn" data-tip="回到最新" id="mmBottom"><svg class="icon sm" data-icon="arrow-d"></svg></button>
          </div>
        </div>
        <!-- Not role="tooltip": the panel holds clickable outline headings, and a
             tooltip is not allowed to contain interactive content. It is a
             pointer-driven preview over an aria-hidden track, so it stays a
             plain container. -->
        <div class="mm-preview hidden" id="mmTip"></div>

        <!-- Was a <div> with a click handler: the one control that gets you back
             to live output, and it was mouse-only. -->
        <button class="new-content-pill hidden" id="newContentPill">
          <svg class="icon sm" data-icon="arrow-d" aria-hidden="true"></svg>有 3 条新事件
        </button>

        <!-- 输入区 -->
        <div class="composer-region">
          <!-- Todo Dock：任务清单固定在输入框上方，不随对话滚动；标题栏可折叠 -->
          <div class="todo-dock" id="todoDock" aria-label="Todo 任务清单"></div>
          <!-- Deck：待处理的审批 / 提问固定在输入框上方（最靠近输入，优先处理）。
               决议后卡片从这里消失，对话流末尾追加一条历史记录。 -->
          <div class="deck" id="deck" role="region" aria-label="待处理的审批与提问" aria-live="polite"></div>
          <!-- 项目上下文条（Codex 风格）：初始/空闲对话显示项目、分支与已加载文件。
               运行时 setRunning(true) 隐藏它、换成下方运行状态条。 -->
          <div class="ctx-strip" id="ctxStrip" role="status" aria-live="polite">
            <span class="ctx-item"><svg class="icon sm" data-icon="folder-open" aria-hidden="true"></svg><span id="ctxProjectName">omp-web</span></span>
            <span class="ctx-item"><svg class="icon sm" data-icon="cpu" aria-hidden="true"></svg><span id="ctxMachineName">本地</span></span>
            <span class="ctx-item"><svg class="icon sm" data-icon="branch" aria-hidden="true"></svg><span id="ctxBranchName">main</span><span class="dot amber" id="ctxBranchDot" data-tip="3 个未提交修改"></span></span>
            <span class="spacer"></span>
            <span class="ctx-item muted" id="ctxFileCount"><svg class="icon sm" data-icon="file" aria-hidden="true"></svg>41 个文件</span>
          </div>
          <!-- Steering / Follow-up 运行状态条 -->
          <div class="run-strip hidden" id="runStrip" role="toolbar" aria-label="运行中操作">
            <span class="spacer"></span>
            <span class="fq-chip" id="fqChip"><svg class="icon sm" data-icon="queue" aria-hidden="true"></svg>Follow-up ×1</span>
            <button class="btn small outline" id="btnSteer"><svg class="icon sm" data-icon="steering" aria-hidden="true"></svg>Steering</button>
            <button class="btn small danger" id="btnAbort"><svg class="icon sm" data-icon="stop" aria-hidden="true"></svg>Abort</button>
          </div>

          <div class="composer" id="composer">
            <div class="composer-ctx" id="ctxChips" aria-label="已引用的上下文" role="group"></div>
            <!-- Placeholder-only labelling fails as soon as the user types: the
                 field loses its name mid-input. A visually hidden <label> keeps
                 the name permanent without changing the layout. The @ and /
                 completion popup is announced via aria-controls/expanded, which
                 the original had no equivalent of. -->
            <label class="sr-only" for="composerInput">消息输入框。输入 / 触发命令，@ 引用文件、Agent、Diff 或 Preview 元素</label>
            <textarea id="composerInput" rows="2"
                      placeholder="输入消息… 输入 / 触发命令，@ 引用文件、Agent、Diff、Preview 元素"
                      aria-describedby="composerHint" aria-controls="completePop" aria-expanded="false"></textarea>
            <p class="sr-only" id="composerHint">按 Enter 发送，Shift+Enter 换行</p>
            <!-- 单行操作栏：左（附件/引用/指令/权限模式） · 右（模型 / 思考强度 + 发送） -->
            <div class="composer-bar">
              <div class="cb-group">
                <button class="icon-btn small" data-tip="附件 / 图片"><svg class="icon sm" data-icon="attach"></svg></button>
                <button class="icon-btn small" data-tip="@ 引用"><svg class="icon sm" data-icon="at"></svg></button>
                <button class="icon-btn small" data-tip="Slash Commands"><svg class="icon sm" data-icon="slash"></svg></button>
              </div>
              <!-- These four pills each open a menu and each show current state.
                   aria-label carries the "what" so the visible text can stay a
                   bare value ("default", "high") without being meaningless out
                   of context. -->
              <button class="pill-btn" id="btnPermission" data-tip="权限模式"
                      aria-haspopup="true" aria-expanded="false" aria-label="权限模式：default">
                <svg class="icon sm" data-icon="shield" aria-hidden="true"></svg><span id="permLabel">default</span>
              </button>
              <span class="spacer"></span>
              <button class="pill-btn meta-model" id="btnModel" data-tip="切换模型"
                      aria-haspopup="true" aria-expanded="false" aria-label="当前模型：gemini-3.6-flash">
                <svg class="icon sm" data-icon="cpu" aria-hidden="true"></svg><span id="modelLabel">gemini-3.6-flash</span>
              </button>
              <button class="pill-btn" id="btnThinking" data-tip="思考强度 (Thinking Level)"
                      aria-haspopup="true" aria-expanded="false" aria-label="思考强度：high">
                <svg class="icon sm" data-icon="brain" aria-hidden="true"></svg><span id="thinkingLabel">high</span>
              </button>
              <button class="send-btn" id="btnSend" data-tip="发送 (Enter)"><svg class="icon sm" data-icon="send"></svg></button>
            </div>
          </div>
          <div class="complete-pop hidden" id="completePop" role="listbox" aria-label="自动补全"></div>
          <!-- Match count for the @ / popup. Announced politely so typing a query
               tells you how many results appeared without interrupting input. -->
          <div class="sr-only" role="status" aria-live="polite" id="completeCount"></div>
        </div>
      </div>

      <!-- 右侧功能面板：Changes / Diff / Preview / Agents
           Both panels are tab sets. They were styled as tabs but had no tab
           semantics: role/aria-selected/aria-controls were all absent, so a
           screen reader announced six unrelated buttons and there was no
           arrow-key movement between them. The count badges also needed names —
           a bare "8" next to "Changes" does not say 8 of what. -->
      <aside class="side-panel" id="sidePanel" aria-label="功能面板">
        <!-- 宽度调节条：面板左缘，拖拽/方向键调整宽度（对齐左侧栏体验） -->
        <div class="sp-resizer" id="spResizer" role="separator" tabindex="0"
             aria-orientation="vertical" aria-label="调整右侧面板宽度"></div>
        <div class="sp-head">
          <div class="tabs" id="spTabs" role="tablist" aria-label="面板视图">
            <button data-sp="changes" class="active" role="tab" aria-selected="true" aria-controls="spChanges" id="spTabChanges">
              <svg class="icon sm" data-icon="diff" aria-hidden="true"></svg>Changes
              <span class="chip gray xs">8<span class="sr-only"> 个变更文件</span></span>
            </button>

<template id="tpl-diagnostics">

    <div style="display:flex;align-items:center;margin-bottom:16px">
      <div>
        <h1 style="font-size:18px">诊断中心</h1>
        <p class="muted small">面向开源项目用户与开发者的运行状态全景。普通信息优先，高级细节已折叠。</p>

          <div class="muted">13:58:12.512 [rpc ←] {"jsonrpc":"2.0","id":481,"result":{"ok":true,"nodes":142}} · 31ms</div>

<template id="tpl-model-config">
  <!-- 越过页头导航直达内容。页头有 7 个导航项 + tab 组，键盘用户否则每次
       进页面都要先穿过它们。 -->
  <a class="skip-link" href="#mcPanels">跳到内容</a>
  <div class="page-wide" id="mcRoot">

    <!-- tab 组由 page-model-config.js 构建（要按实时数据算徽标）。
         容器上先写好 role/aria，这样脚本失败时结构语义仍然成立。 -->
    <div class="mc-tabbar">
      <div class="mc-tabs" id="mcTabs" role="tablist" aria-label="模型配置视图"></div>
    </div>

    <div id="mcPanels" tabindex="-1">
      <!-- 两个面板都常驻 DOM，切换只改 hidden：面板内部各自维护草稿
           与展开状态，卸载重建会把它们全丢掉 —— 这正是合并要解决的
           问题，不能在外壳这一层重新引入。 -->
      <section id="mcPanelProviders" role="tabpanel" aria-labelledby="mcTabProviders" tabindex="0">
        <div id="mpRoot"></div>
      </section>
      <section id="mcPanelRoles" role="tabpanel" aria-labelledby="mcTabRoles" tabindex="0" hidden>
        <div id="roleRoot"></div>
      </section>
    </div>

  </div>
</template>
