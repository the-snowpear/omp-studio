<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OMP Studio — 已迁移到单页</title>
<!-- 原多页入口已合并为单 HTML（index.html#!…）。此页是转发 stub：
     保住已分享链接；meta refresh 在 file:// 下不依赖 JS 也能跳，脚本负责
     把 hash 一起带过去。 -->
<meta http-equiv="refresh" content="0; url=index.html#!home">
<script>
  (function () {
    var h = location.hash.slice(1);
    location.replace('index.html#!home' + (h ? '/' + h : ''));
  })();
</script>
</head>
<body>
<p style="padding:24px;font-size:13px">
  项目主页已合并到 <a href="index.html#!home">OMP Studio</a>。
</p>
</body>
</html>
