<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OMP Studio — 已迁移到单页</title>
<!-- 原多页入口已合并为单 HTML（index.html#!…）。此页是转发 stub；
     旧的 #providers / #roles / #edit= / #role= / #assign= / #s= 深链原样
     带过去，由 model-config 的路由解析。无 hash → 落在供应商 tab。 -->
<meta http-equiv="refresh" content="0; url=index.html#!model-config">
<script>
  (function () {
    var h = location.hash.slice(1);
    location.replace('index.html#!model-config/' + (h || 'providers'));
  })();
</script>
</head>
<body>
<p style="padding:24px;font-size:13px">
  模型配置已合并到 <a href="index.html#!model-config/providers">OMP Studio</a>。
</p>
</body>
</html>
