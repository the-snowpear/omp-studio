  <rect x="64" y="64" width="246" height="30" rx="15" fill="#1a1626" stroke="url(#hdbrand)" stroke-width="1.5"/>
  <circle cx="82" cy="79" r="4.5" fill="#4ade80"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="94" y="84" font-size="13.5" font-weight="700" fill="#b9b2d2">0.2.0 · 全新窗口化工作台</text>
  <text x="62" y="172" font-size="76" font-weight="800" letter-spacing="-2.5" fill="url(#hdbrandShift)">OMP Studio</text>
  <text x="64" y="226" font-size="30" font-weight="700" fill="#f2effc" letter-spacing="-.5">把 Agent 装进一张随你摆放的工作台</text>
  <text x="64" y="270" font-size="19" fill="#b9b2d2">oh-my-pi 的桌面控制台 —— 对话、工具和窗口</text>
  <text x="64" y="300" font-size="19" fill="#b9b2d2">都能拖出、吸附、停靠，并排跑多个 Agent。</text>
