<text x="34" y="142" font-size="14" font-weight="700" fill="#a78bfa">$</text></g>
<text x="58" y="142" font-size="14" fill="#e9e5f7" clip-path="url(#tlc2)" xml:space="preserve">npm run omp:overlay:apply</text><clipPath id="tlc3"><rect x="58" y="154" height="26" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.5786;0.6268;0.96;1" values="0;0;134.75;134.75;0" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1" /></rect></clipPath>
