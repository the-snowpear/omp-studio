<text x="34" y="202" font-size="14" font-weight="700" fill="#16a34a">✓</text></g>
<text x="58" y="202" font-size="14" fill="#16a34a" clip-path="url(#tlc4)" xml:space="preserve">Electron 工作台已启动  ·  拖动对话顶栏，开始摆放你的窗口</text><rect x="539.1999999999999" y="189" width="8" height="16" fill="#a78bfa" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.6839;0.6849;0.96;1" values="0;0;1;1;0" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1" /><animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
