<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
<title>5 种停靠位置 · 6 种分屏模板 · 8 向窗口缩放 · 3 个桌面安装包</title>
<defs>
  <linearGradient id="sdbrand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset=".55" stop-color="#f472b6"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="sdbrandShift" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset=".35" stop-color="#f472b6"/>
    <stop offset=".7" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#a78bfa"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="sddots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#a78bfa" opacity="0.192"/>
  </pattern>
  <filter id="sdsoft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
  </filter>
  <filter id="sdblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <linearGradient id="sdsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="sdclip"><rect x="1" y="1" width="1198" height="174" rx="22"/></clipPath>
</defs>
<rect x=".5" y=".5" width="1199" height="175" rx="22" fill="#1a1626" stroke="#2c2640"/>
<g clip-path="url(#sdclip)"><rect x="-300" y="0" width="300" height="176" fill="url(#sdsheen)"><animate attributeName="x" values="-300;1200;1200" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite"/></rect></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin="0.0s" fill="freeze"/>
  <text x="150.0" y="84" text-anchor="middle" font-size="68" font-weight="800" fill="url(#sdbrand)" letter-spacing="-2">5</text>
  <text x="150.0" y="118" text-anchor="middle" font-size="21" font-weight="800" fill="#f2effc">种停靠位置</text>
  <text x="150.0" y="146" text-anchor="middle" font-size="15" fill="#b9b2d2">左栏 · 工具区 · 右栏 · 底栏 · 浮窗</text></g>
  <rect x="300.0" y="36" width="1" height="104" fill="#3a3352"/><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin="0.2s" fill="freeze"/>
  <text x="450.0" y="84" text-anchor="middle" font-size="68" font-weight="800" fill="url(#sdbrand)" letter-spacing="-2">6</text>
  <text x="450.0" y="118" text-anchor="middle" font-size="21" font-weight="800" fill="#f2effc">种分屏模板</text>
  <text x="450.0" y="146" text-anchor="middle" font-size="15" fill="#b9b2d2">悬停最大化键即选</text></g>
  <rect x="600.0" y="36" width="1" height="104" fill="#3a3352"/><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin="0.4s" fill="freeze"/>
  <text x="750.0" y="84" text-anchor="middle" font-size="68" font-weight="800" fill="url(#sdbrand)" letter-spacing="-2">8</text>
  <text x="750.0" y="118" text-anchor="middle" font-size="21" font-weight="800" fill="#f2effc">向窗口缩放</text>
  <text x="750.0" y="146" text-anchor="middle" font-size="15" fill="#b9b2d2">分界线联动相邻窗口</text></g>
  <rect x="900.0" y="36" width="1" height="104" fill="#3a3352"/><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin="0.6000000000000001s" fill="freeze"/>
  <text x="1050.0" y="84" text-anchor="middle" font-size="68" font-weight="800" fill="url(#sdbrand)" letter-spacing="-2">3</text>
  <text x="1050.0" y="118" text-anchor="middle" font-size="21" font-weight="800" fill="#f2effc">个桌面安装包</text>
  <text x="1050.0" y="146" text-anchor="middle" font-size="15" fill="#b9b2d2">Win x64 · Win ARM64 · macOS</text></g>

</svg>
