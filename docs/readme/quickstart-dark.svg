<text x="58" y="112" font-size="14" fill="#e9e5f7" clip-path="url(#tdc1)" xml:space="preserve">cd omp-studio &amp;&amp; npm install</text><clipPath id="tdc2"><rect x="58" y="124" height="26" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.4589;0.5393;0.96;1" values="0;0;219.24999999999997;219.24999999999997;0" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1" /></rect></clipPath>
