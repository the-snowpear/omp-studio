<text x="58" y="82" font-size="14" fill="#e9e5f7" clip-path="url(#tdc0)" xml:space="preserve">git clone --recurse-submodules https://github.com/the-snowpear/omp-studio.git</text><clipPath id="tdc1"><rect x="58" y="94" height="26" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.3296;0.4196;0.96;1" values="0;0;244.59999999999997;244.59999999999997;0" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1" /></rect></clipPath>
