<text x="58" y="202" font-size="14" fill="#4ade80" clip-path="url(#tdc4)" xml:space="preserve">Electron 工作台已启动  ·  拖动对话顶栏，开始摆放你的窗口</text><rect x="539.1999999999999" y="189" width="8" height="16" fill="#c4b5fd" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.6839;0.6849;0.96;1" values="0;0;1;1;0" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1" /><animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
