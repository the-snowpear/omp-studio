<style>:root{--ink:#edeaf4;--mute:#a39fb3;--ease:cubic-bezier(.32, .72, 0, 1);--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}*{box-sizing:border-box;margin:0}html,body{height:100%;color:var(--ink);-webkit-font-smoothing:antialiased;background:#09080d;font-family:Geist Variable,Noto Sans SC Variable,system-ui,sans-serif}main{gap:2px;height:100dvh;min-height:560px;display:flex}a{min-width:0;color:inherit;isolation:isolate;transition:flex-grow .7s var(--ease);flex:1 1 0;text-decoration:none;position:relative;overflow:hidden}main:hover a,main:focus-within a{flex-grow:.72}main a:hover,main a:focus-visible{flex-grow:1.9}a:focus-visible{outline-offset:-4px;outline:2px solid #fff}img{object-fit:cover;object-position:var(--focus,50% 50%);z-index:-2;width:100%;height:100%;transition:scale 1.1s var(--ease);position:absolute;inset:0}a:hover img,a:focus-visible img{scale:1.035}a:after{content:"";z-index:-1;background:linear-gradient(#0000 38%,#06050aeb 88%);position:absolute;inset:0}.copy{width:min(100%,34rem);padding:clamp(20px,2.6vw,40px);position:absolute;bottom:0;left:0;right:0}h2{letter-spacing:-.03em;font-size:clamp(30px,3.4vw,54px);font-weight:800;line-height:1.1}h2 small{letter-spacing:0;color:var(--mute);margin-top:7px;font-size:14.5px;font-weight:500;display:block}p{color:#d3cfdf;margin-top:12px;font-size:15px;line-height:1.65}.open{color:#0c0a12;background:#f3f0fb;border-radius:999px;margin-top:16px;padding:8px 18px;font-size:14px;font-weight:600;display:inline-block}@media (max-width:860px){main{flex-direction:column;height:auto}a{flex:none;height:76dvh}main:hover a,main:focus-within a,main a:hover{flex-grow:0}}@media (prefers-reduced-motion:reduce){a,img{transition:none}}</style>

<body>
<main aria-label="三版方案">
  <a href="./a/" style="--focus: 84% 50%">
    <img src="./media/concepts/a.webp" alt="方案 A 首屏：暗色背景上的玻璃 π">
    <div class="copy"><h2>穿越<small>暗色，电影感，滚动即镜头</small></h2>
      <p>实时光线步进的玻璃 π，镜头从拱门穿过，飞过散落的窗口，落进一段随滚动播放的真实对话。</p>
      <span class="open">打开方案 A</span></div>
  </a>
  <a href="./b/" style="--focus: 82% 40%">
    <img src="./media/concepts/b.webp" alt="方案 B 首屏：白色石膏质感的窗口里运行着真实应用">
    <div class="copy"><h2>活窗<small>亮色，石膏质感，真机可玩</small></h2>
      <p>首屏就是真实的 Studio 渲染层。可以点、可以拖大小，导览会替你操作它。</p>
      <span class="open">打开方案 B</span></div>
  </a>
  <a href="./c/" style="--focus: 78% 20%">
    <img src="./media/concepts/c.webp" alt="方案 C 首屏：由字符组成的应用界面">
    <div class="copy"><h2>解析<small>字符网格，键盘优先</small></h2>
      <p>把 TUI 与 GUI 的差别做成着色器：界面从字符解析成画面。Ctrl K 可以操作整个站点。</p>
      <span class="open">打开方案 C</span></div>
  </a>
