# OMP Studio — electron-builder NSIS installer (Windows x64 / ARM64).
# Run one architecture at a time: OMP_TARGET_ARCH=x64|arm64 npm run pack:win.
# pack-win explicitly selects one arch after staging its matching Runtime.

appId: com.ompstudio.desktop
productName: OMP Studio
copyright: Copyright © 2026 OMP Studio
forceCodeSigning: false

directories:
  app: apps/desktop
  output: outputs/installer
  buildResources: packaging/resources

# Keep the executable name stable for NSIS process checks and shortcuts.
executableName: OMP Studio
artifactName: OMP-Studio-Setup-${version}-${os}-${arch}.${ext}

files:
  - dist/**/*
  - package.json
  - resources/**/*
  - "!dist/test/**"
  - "!dist/**/*.map"
  - "!**/*.tsbuildinfo"
  # Workspace packages are copied in full; never ship local Runtime artifact caches
  # or package tests inside asar / asar.unpacked.
  - "!**/dist/artifacts/**"
  - "!**/dist/test/**"
  - "!**/*.exe"

# Native PTY bits must not stay inside asar. Icons are also unpacked so a
# fallback path exists if extraResources is missing.
asarUnpack:
  - "**/*.node"
  - "**/node-pty/**"
  - "resources/icon.ico"
  - "resources/icon.png"

npmRebuild: true
buildDependenciesFromSource: false

# Renderer is loaded as appPath/../renderer/dist/index.html
# (`app.asar` → `resources/renderer/dist`). See resolveRendererEntry.
# Product icons live next to app.asar as real files: Windows Shell cannot
# use an asar path for the taskbar / notifications.
extraResources:
  - from: apps/renderer/dist
    to: renderer/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: apps/desktop/resources/icon.ico
    to: icon.ico
  - from: apps/desktop/resources/icon.png
    to: icon.png

# Signed Runtime live copy next to the exe (not inside asar).
# Only the current series version is staged by pack:win:prepare.
# Layout: $INSTDIR\runtime\versions\<ver>\omp.exe
extraFiles:
  - from: packaging/runtime-payload
    to: runtime/versions
    filter:
      - "**/*"
      - "!**/.staging-*/**"
      - "!signing-private.pem"
  - from: packaging/runtime-keys
    to: runtime-keys
    filter:
      - key-id.txt
      - trusted-public.pem
      - trusted-keys.json
      - "*.pem"
      - "!signing-private.pem"
      - "!**/*.pem.bak"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: apps/desktop/resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  # Keep rcedit (icon / version resources). Skip Authenticode only.
  signExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OMP Studio
  menuCategory: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  include: packaging/nsis/custom.nsh
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  uninstallDisplayName: OMP Studio
  artifactName: OMP-Studio-Setup-${version}-${os}-${arch}.${ext}
  # Unsigned 0.1.0 preview. Replace with a real Authenticode cert before GitHub Releases.
  # signingHashAlgorithms: [sha256]
